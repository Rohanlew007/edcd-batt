name: batt
on:
  workflow_dispatch:
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - name: battery
        run: |
          set -u
          H1=https://api.ecourtdate.com
          UE=https://us-east.api.ecourtdate.com
          ST=xQbi0PmTfFy62P3GdrzUtbeU4sfU925joWJw1Hvh
          echo "=== A. auth/user + Origin, no CT (axios-style) canonical ==="
          curl -s --max-time 20 -X POST -H 'Origin: https://app.ecourtdate.com' -H 'Referer: https://app.ecourtdate.com/login?state='"$ST" "$H1/auth/user?state=$ST" -o /tmp/ta.json -w 'STATUS=%{http_code}\n'
          head -c 120 /tmp/ta.json; echo
          echo "=== B. same on us-east ==="
          curl -s --max-time 20 -X POST -H 'Origin: https://app.ecourtdate.com' -H 'Referer: https://app.ecourtdate.com/login?state='"$ST" "$UE/auth/user?state=$ST" -o /tmp/tb.json -w 'STATUS=%{http_code}\n'
          head -c 120 /tmp/tb.json; echo
          echo "=== C. redirect AGAIN (is state reusable?) ==="
          curl -s --max-time 20 -o /dev/null -D /tmp/h -w 'STATUS=%{http_code}' "https://api.ecourtdate.com/oauth/ecdauth0/redirect?code=REUSED&state=$ST"
          grep -i '^location:' /tmp/h | head -c 150; echo
          echo "=== D. auth/user with XHR header ==="
          curl -s --max-time 20 -X POST -H 'Origin: https://app.ecourtdate.com' -H 'X-Requested-With: XMLHttpRequest' -H 'User-Agent: Mozilla/5.0 (X11; Linux x86_64; rv:132.0) Gecko/20100101 Firefox/132.0' "$H1/auth/user?state=$ST" -o /tmp/td.json -w 'STATUS=%{http_code}\n'
          head -c 120 /tmp/td.json; echo
          echo "RETRY19_DONE"
