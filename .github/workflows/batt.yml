name: batt
on:
  workflow_dispatch:
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - name: battery
        run: |
          set -u
          HA=https://app.ecourtdate.com
          H1=https://api.ecourtdate.com
          ST=xXIZajGlc9cujXrSDns7zdvNHgdyWG4pkSeHA6ZH
          echo "=== follow app/login?state ==="
          curl -s -i --max-time 20 -c /tmp/appjar.txt "$HA/login?state=$ST" -o /tmp/app.txt -w 'STATUS=%{http_code}\n'
          grep -iE '^HTTP|^location|^content-type|^set-cookie' /tmp/app.txt | sed 's/=\(....\)[^;]*/=\1***/' | head -10
          echo "cookie names: $(grep -oE '^[^# ]+' /tmp/appjar.txt | grep -v '^$' | tr '\n' ' ')"
          echo "token-shaped in body: $(grep -coE '[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}' /tmp/app.txt || echo 0)"
          echo "body head: $(head -c 200 /tmp/app.txt | tr '\n' ' ')"
          echo "=== api battery with app cookie ==="
          for p in /v1/users/current /v1/schedules /v1/locations /v1/clients /v1/settings /v1/roles; do
            code=$(curl -s -o /tmp/b -w '%{http_code}' --max-time 15 -b /tmp/appjar.txt "$H1$p" || echo ERR)
            echo "S2 GET $p -> $code :: $(head -c 160 /tmp/b | tr '\n' ' ')"
            sleep 1
          done
          echo "BATT11_DONE"
