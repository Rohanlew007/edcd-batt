name: batt
on:
  workflow_dispatch:
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - name: battery
        run: |
          set -u
          ST=xXIZajGlc9cujXrSDns7zdvNHgdyWG4pkSeHA6ZH
          echo "=== auth/user on canonical ==="
          curl -s --max-time 15 -X POST "https://api.ecourtdate.com/auth/user?state=$ST" -o /tmp/a.json -w 'STATUS=%{http_code}\n'
          head -c 200 /tmp/a.json | sed 's/[A-Za-z0-9_-]\{25,\}/TOKEN/g'
          echo
          sleep 1
          echo "=== fresh GET /oauth/ecdauth0 on us-east.api ==="
          curl -s --max-time 15 "https://us-east.api.ecourtdate.com/oauth/ecdauth0" -o /tmp/b.json -w 'STATUS=%{http_code}\n'
          echo "URLBODY_BEGIN"
          cat /tmp/b.json | sed 's|\\/|/|g'
          echo
          echo "URLBODY_END"
          echo "=== fresh GET /oauth/ecdauth0 on canonical (for compare) ==="
          curl -s --max-time 15 "https://api.ecourtdate.com/oauth/ecdauth0" -o /tmp/c.json -w 'STATUS=%{http_code}\n'
          echo "CURLBODY_BEGIN"
          cat /tmp/c.json | sed 's|\\/|/|g'
          echo
          echo "CURLBODY_END"
          echo "BATT13_DONE"
