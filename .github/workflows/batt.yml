name: batt
on:
  workflow_dispatch:
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - name: battery
        run: |
          set -u
          H1=https://api.ecourtdate.com
          UA='Mozilla/5.0 (X11; Linux x86_64; rv:146.0) Gecko/20100101 Firefox/146.0'
          echo "=== IP ==="
          curl -s --max-time 10 https://api.ipify.org; echo
          echo "=== GET /v1/health baseline ==="
          curl -s --max-time 15 -H "User-Agent: $UA" -H 'Accept: application/json' "$H1/v1/health" | head -c 200; echo
          echo "=== POST-shape probes (validation-before-auth oracle) ==="
          pp() {
            code=$(curl -s --max-time 15 -o /tmp/pp.out -w '%{http_code}' -X POST -H "User-Agent: $UA" -H 'Accept: application/json' -H 'X-Requested-With: XMLHttpRequest' -H 'Content-Type: application/json' ${2:+-d "$2"} "$H1$1" || echo ERR)
            echo "P POST $1 -> $code :: $(head -c 150 /tmp/pp.out | tr '\n' ' ')"
            sleep 1
          }
          pp /v1/generator '{}'
          pp /v1/preview '{}'
          pp /v1/referrals '{}'
          pp /v1/calls/token '{}'
          pp /v1/agency_phones/phone/calls '{}'
          pp /v1/otps '{}'
          pp /v1/queue/visits '{}'
          pp /v1/generator '{"template":"[Date]"}'
          pp /v1/preview '{"template":"[Date]"}'
          echo "=== queue kiosk Idempotency-Key probe ==="
          code=$(curl -s --max-time 15 -o /tmp/qv.out -w '%{http_code}' -X POST -H "User-Agent: $UA" -H 'Content-Type: application/json' -H 'Idempotency-Key: bb-test-001' -d '{"line":"bb","name":"bb"}' "$H1/v1/queue/visits" || echo ERR)
          echo "P POST /v1/queue/visits (idem) -> $code :: $(head -c 150 /tmp/qv.out | tr '\n' ' ')"
          sleep 1
          echo "=== resume sweep (stale-000 + untested) ==="
          PATHS='/v1/checkin /v1/checkins /v1/report_issue /v1/reports /v1/research /v1/restore /v1/roles /v1/sample_templates /v1/schedules /v1/search /v1/sent_files /v1/settings /v1/setup /v1/statuses /v1/submissions /v1/submissions/total /v1/subscribe /v1/supervisions /v1/sync /v1/tasks /v1/tickets /v1/total /v1/training /v1/translator /v1/translator/detect /v1/unreachables /v1/auto_docs/x/preview'
          for p in $PATHS; do
            code=$(curl -s --max-time 15 -o /tmp/rs.out -w '%{http_code}' -H "User-Agent: $UA" -H 'Accept: application/json' -H 'X-Requested-With: XMLHttpRequest' "$H1$p" || echo ERR)
            echo "R GET $p -> $code :: $(head -c 80 /tmp/rs.out | tr '\n' ' ')"
            sleep 1
          done
          echo "BATTJ_DONE"
