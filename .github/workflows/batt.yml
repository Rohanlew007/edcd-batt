name: batt
on:
  workflow_dispatch:
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - name: battery
        env:
          ECD_PW: ${{ secrets.ECD_PW }}
        run: |
          set -u
          A=https://ecourtdate.us.auth0.com
          H1=https://api.ecourtdate.com
          echo "=== signup connection probes ==="
          for C in Username-Password-Authentication email ecdauth0 Default; do
            echo "--- conn=$C"
            curl -s --max-time 15 -X POST -H 'Content-Type: application/json' "$A/dbconnections/signup" -d "{\"client_id\":\"C5aRYUevyR9BDi1THXm1JhgE4PHxNK33\",\"email\":\"yasirsec21@gmail.com\",\"password\":\"$ECD_PW\",\"connection\":\"$C\"}" | head -c 300
            echo
            sleep 1
          done
          echo "=== ROPG shape probe (wrong pw) ==="
          curl -s --max-time 15 -X POST "$A/oauth/token" -H 'Content-Type: application/json' -d '{"grant_type":"password","client_id":"C5aRYUevyR9BDi1THXm1JhgE4PHxNK33","username":"yasirsec21@gmail.com","password":"definitely-wrong-probe","scope":"openid profile email"}' | head -c 300
          echo
          sleep 1
          echo "=== discovery ==="
          curl -s --max-time 15 "$A/.well-known/openid-configuration" | head -c 700
          echo
          echo "BATT5_DONE"
