name: batt
on:
  workflow_dispatch:
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - name: battery
        run: |
          set -u
          HA=https://app.ecourtdate.com
          HE=https://us-east.ecourtdate.com
          echo "=== index HTML diff ==="
          curl -s --compressed --max-time 15 "$HA/" -o /tmp/ha.html
          curl -s --compressed --max-time 15 "$HE/" -o /tmp/he.html
          echo "app / size: $(wc -c < /tmp/ha.html) | us-east / size: $(wc -c < /tmp/he.html)"
          diff <(tr '>' '>\n' < /tmp/ha.html) <(tr '>' '>\n' < /tmp/he.html) | head -30
          echo "=== script srcs app ==="
          grep -oE '(src|href)="[^"]+\.(js|css)"' /tmp/ha.html | head -10
          echo "=== script srcs us-east ==="
          grep -oE '(src|href)="[^"]+\.(js|css)"' /tmp/he.html | head -10
          echo "=== chunk exists cross-check ==="
          APPCHUNK=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/ha.html | head -1)
          UECHUNK=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/he.html | head -1)
          echo "app chunk: $APPCHUNK | us-east chunk: $UECHUNK"
          if [ -n "$APPCHUNK" ]; then
            curl -s --compressed --max-time 20 -o /tmp/ach.js "$HA$APPCHUNK"; echo "app chunk sha: $(sha256sum /tmp/ach.js | cut -c1-16) size: $(wc -c < /tmp/ach.js)"
          fi
          if [ -n "$UECHUNK" ]; then
            curl -s --compressed --max-time 20 -o /tmp/uec.js "$HE$UECHUNK"; echo "us-east chunk sha: $(sha256sum /tmp/uec.js | cut -c1-16) size: $(wc -c < /tmp/uec.js)"
          fi
          echo "=== us-east API config hints in chunk ==="
          if [ -n "$UECHUNK" ]; then grep -oE '(api[a-z.-]*\.ecourtdate\.com|ecourtdate[a-z.-]*\.(com|io)|/v1/[a-z/_-]+)' /tmp/uec.js | sort -u | head -20; fi
          echo "BATT7_DONE"
