name: batt
on:
  workflow_dispatch:
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - name: battery
        run: |
          set -u
          H1=https://api.ecourtdate.com
          echo "=== GET canonical /oauth/ecdauth0 ==="
          curl -s --max-time 20 "$H1/oauth/ecdauth0" -o /tmp/au.json -w 'STATUS=%{http_code}\n'
          echo "URLBODY_BEGIN"
          head -c 1200 /tmp/au.json
          echo
          echo "URLBODY_END"
          echo "BATT16A_DONE"
