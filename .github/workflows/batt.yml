name: batt
on:
  workflow_dispatch:
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - name: battery
        run: |
          set -u
          H1=https://api.ecourtdate.com
          H2=https://api.citations.ecourtdate.com
          H3=https://ecs.ecourtdate.com
          echo "=== citations (FastAPI) discovery ==="
          for p in / /docs /openapi.json /redoc /api /api/v1 /health /healthz /docs/oauth2-redirect /v1 /v1/openapi.json; do
            code=$(curl -s -o /tmp/b -w '%{http_code}' --max-time 15 "$H2$p" || echo ERR)
            echo "CIT GET $p -> $code :: $(head -c 120 /tmp/b | tr '\n' ' ')"
            sleep 1
          done
          echo "=== main API more paths ==="
          for p in /v1/courts /v1/judges /v1/reminders /v1/notifications /v1/flows /v1/automations /v1/lookups /v1/ip-lookups /v1/templates /v1/conversations /v1/embeddings /v1/dashboards /v1/files /v1/calendars /v1/organizations /v1/devices /v1/sessions /v1/roles /v1/permissions /v1/settings /v1/me /v1/version /v1/queue /v1/realtime /v1/presence /v1/supervisions /v1/verify-contact/send /v1/keys/test/revokeTokens /v1/case-search/agencies /v1/schedules/ics/upcoming /v1/schedules/upcoming/ics /v1/schedules/current/ics; do
            code=$(curl -s -o /tmp/b -w '%{http_code}' --max-time 15 "$H1$p" || echo ERR)
            echo "M GET $p -> $code :: $(head -c 100 /tmp/b | tr '\n' ' ')"
            sleep 1
          done
          echo "=== POST-only routes ==="
          for spec in "/v1/translator|{\"text\":\"court\"}" "/v1/translator|{}" "/v1/synthesize|{\"text\":\"court\"}" "/v1/synthesize|{}" "/oauth/test|{}" "/v1/chats|{}" "/v1/search|{\"query\":\"court\"}"; do
            p=${spec%%|*}; body=${spec#*|}
            code=$(curl -s -o /tmp/b -w '%{http_code}' -X POST --max-time 15 -H 'Content-Type: application/json' -d "$body" "$H1$p" || echo ERR)
            echo "M POST $p $body -> $code :: $(head -c 150 /tmp/b | tr '\n' ' ')"
            sleep 1
          done
          echo "=== headers on key 401 + 405 ==="
          curl -s -i --max-time 15 "$H1/v1/users/current" | head -c 500
          echo
          sleep 1
          curl -s -i -X OPTIONS --max-time 15 -H "Origin: https://app.ecourtdate.com" -H "Access-Control-Request-Method: POST" "$H1/v1/translator" | head -c 500
          echo
          sleep 1
          echo "=== ecs live ==="
          code=$(curl -s -o /tmp/b -w '%{http_code}' --max-time 15 "$H3/" || echo ERR)
          echo "ECS GET / -> $code"
          grep -oE '(src|href)="[^"]+"' /tmp/b | head -20
          CHUNK=$(grep -oE '/assets/[a-zA-Z0-9._-]+\.js' /tmp/b | head -1)
          echo "ECS chunk: $CHUNK"
          for p in /robots.txt /sitemap.xml /manifest.json /api/health /api/locations /api/schedules /api/events "$CHUNK"; do
            code=$(curl -s -o /tmp/b -w '%{http_code}' --max-time 15 "$H3$p" || echo ERR)
            echo "ECS GET $p -> $code :: $(head -c 100 /tmp/b | tr '\n' ' ')"
            sleep 1
          done
          echo "BATT2_DONE"
