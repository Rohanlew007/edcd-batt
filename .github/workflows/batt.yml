name: batt
on:
  workflow_dispatch:
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - name: battery
        run: |
          set +e
          H1=https://api.ecourtdate.com
          UE=https://us-east.api.ecourtdate.com
          echo "=== A. GET $H1/login body ==="
          curl -s --max-time 15 -D /tmp/ha "$H1/login" -o /tmp/ba -w 'STATUS=%{http_code}\n'
          head -c 300 /tmp/ba; echo
          grep -ci 'set-cookie' /tmp/ha
          echo "=== B. GET $UE/login body ==="
          curl -s --max-time 15 -D /tmp/hb "$UE/login" -o /tmp/bb -w 'STATUS=%{http_code}\n'
          head -c 300 /tmp/bb; echo
          grep -i 'set-cookie' /tmp/hb | sed 's/=\(.[^;]\{4,\}\)/=<M>/Ig' | head -c 200; echo
          echo "=== C. GET $UE/login?signin=demo ==="
          curl -s --max-time 15 -c /tmp/jc -D /tmp/hc "$UE/login?signin=demo" -o /tmp/bc -w 'STATUS=%{http_code}\n'
          head -c 300 /tmp/bc; echo
          grep -i 'set-cookie' /tmp/hc | sed 's/=\(.[^;]\{4,\}\)/=<M>/Ig' | head -c 200; echo
          echo "=== D. GET $UE/oauth/ecdauth0 body (for comparison) ==="
          curl -s --max-time 15 -D /tmp/hd "$UE/oauth/ecdauth0" -o /tmp/bd -w 'STATUS=%{http_code}\n'
          head -c 200 /tmp/bd; echo
          grep -i 'set-cookie' /tmp/hd | sed 's/=\(.[^;]\{4,\}\)/=<M>/Ig' | head -c 200; echo
          echo "PROBE24_DONE"
