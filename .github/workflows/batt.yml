name: batt
on:
  workflow_dispatch:
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - name: battery
        run: |
          set -u
          H1=https://api.ecourtdate.com
          echo "=== GET /oauth/ecdauth0 FULL HEADERS ==="
          curl -s --max-time 20 -D /tmp/h1 -o /tmp/b1 "$H1/oauth/ecdauth0" -w 'STATUS=%{http_code}\n'
          grep -viE '^(date|server|cf-|report-to|nel|alt-svc|content-type|content-length|strict|set-cookie: __cf|cache|x-content|x-frame|referrer|permissions|via|cf-cache)' /tmp/h1 | sed 's/=\(.[^;]\{6,\}\)/=<MASKED>/' | head -c 900; echo
          echo "=== auth/user HEADERS (bogus state) ==="
          curl -s --max-time 20 -X POST -D /tmp/h2 -o /tmp/b2 "$H1/auth/user?state=bogus123" -w 'STATUS=%{http_code}\n'
          grep -viE '^(date|server|cf-|report-to|nel|alt-svc|content-type|content-length|strict|cache|x-content|x-frame|referrer|permissions|via|cf-cache)' /tmp/h2 | head -c 500; echo
          head -c 100 /tmp/b2; echo
          echo "PROBE_DONE"
