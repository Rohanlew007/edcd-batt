name: batt
on:
  workflow_dispatch:
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - name: battery
        run: |
          set -u
          H1=https://api.ecourtdate.com
          echo "=== oauth bodies ==="
          for p in /oauth/ecdauth0 /oauth/1 /oauth/ecdauth0/callback /oauth/ecdauth0/login /oauth/ecdauth0/redirect /v1/oauth/ecdauth0; do
            echo "--- GET $p"
            curl -s --compressed --max-time 15 "$H1$p" | head -c 900
            echo
            sleep 1
          done
          echo "--- POST /oauth/ecdauth0"
          curl -s -X POST --max-time 15 -H 'Content-Type: application/json' -d '{}' "$H1/oauth/ecdauth0" | head -c 400
          echo
          sleep 1
          echo "--- GET /oauth/ecdauth0/callback?code=probe&state=probe"
          curl -s -i --max-time 15 "$H1/oauth/ecdauth0/callback?code=probe&state=probe" | tail -c 500
          echo
          echo "BATT4_DONE"
